MODEL: "Qwen"  # The type of multi-modal LLM you would like to use to power the AppAgent, must be either OpenAI or Qwen

OPENAI_API_BASE: "https://api.openai.com/v1/chat/completions"
OPENAI_API_KEY: "sk-"  # Set the value to sk-xxx if you host the openai interface for open llm model
OPENAI_API_MODEL: "gpt-4-vision-preview"  # The only OpenAI model by now that accepts visual input
MAX_TOKENS: 300  # The max token limit for the response completion
TEMPERATURE: 0.0  # The temperature of the model: the lower the value, the more consistent the output of the model
REQUEST_INTERVAL: 10  # Time in seconds between consecutive GPT-4V requests

DASHSCOPE_API_KEY: "sk-f203b6a80a0d4af1800cd9f8bb9b7fa6"  # The dashscope API key that gives you access to Qwen-VL model
QWEN_MODEL: "qwen-vl-plus"

ANDROID_SCREENSHOT_DIR: "/data/local/tmp"  # Set the directory on your Android device to store the intermediate screenshots. Make sure the directory EXISTS on your phone!
ANDROID_XML_DIR: "/data/local/tmp"  # Set the directory on your Android device to store the intermediate XML files used for determining locations of UI elements on your screen. Make sure the directory EXISTS on your phone!

DOC_REFINE: false  # Set this to true will make the agent refine existing documentation based on the latest demonstration; otherwise, the agent will not regenerate a new documentation for elements with the same resource ID.
MAX_ROUNDS: 20  # Set the round limit for the agent to complete the task
DARK_MODE: false  # Set this to true if your app is in dark mode to enhance the element labeling
MIN_DIST: 15  # The minimum distance between elements to prevent overlapping during the labeling process (reduced for better element detection)

# Enhanced Detection Settings
ENABLE_OMNI_PARSER: true  # Enable OmniParser for advanced UI element detection
ENABLE_OCR: true  # Enable OCR for text recognition in images
OCR_CONFIDENCE_THRESHOLD: 0.3  # Minimum confidence threshold for OCR results
OMNI_PARSER_CONFIDENCE_THRESHOLD: 0.2  # Minimum confidence threshold for OmniParser results
CAPTCHA_DETECTION_MODE: "enhanced"  # Use "enhanced" for comprehensive detection, "traditional" for XML-only

# OCR Engine Settings
OCR_ENGINES: ["paddle", "easy", "tesseract"]  # OCR engines to use (in order of preference)
OCR_PREPROCESS_IMAGES: true  # Whether to preprocess images before OCR
OCR_MAX_TEXT_LENGTH: 20  # Maximum length of text to consider for CAPTCHA

# OmniParser Settings
OMNI_PARSER_MODEL: "yolov8n"  # YOLO model to use for object detection
OMNI_PARSER_DEVICE: "auto"  # Device to use: "auto", "cpu", or "cuda"
OMNI_PARSER_MIN_AREA: 100  # Minimum area for detected elements
OMNI_PARSER_MAX_AREA: 50000  # Maximum area for detected elements